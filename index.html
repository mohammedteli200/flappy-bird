<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skywing Rush</title>
<style>
:root{--bg:#dfe6f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e1a}}
:root[data-theme="dark"]{--bg:#0b0e1a}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;user-select:none}
#wrap{width:min(100vw,calc((100vh - 16px)*0.6));aspect-ratio:3/5}
canvas{width:100%;height:100%;display:block;border-radius:14px;box-shadow:0 10px 36px rgba(0,0,0,.4);cursor:pointer}
#wrap{position:relative}
#ui{position:absolute;top:10px;right:10px;bottom:10px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:14px;pointer-events:none}
#ui .brow,#ui #mp,#ui #sp,#ui #gp,#ui #ap{pointer-events:auto}
#mb{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,24,40,.55);font-size:20px;cursor:pointer;backdrop-filter:blur(4px)}
#mp{width:230px;box-sizing:border-box;background:rgba(18,22,40,.94);color:#eef0ff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#mp[hidden]{display:none}
#mp .row{display:flex;gap:6px;flex-wrap:wrap}
#mp button,#mp .pick{flex:1;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:inherit;border-radius:10px;padding:8px 6px;font:inherit;cursor:pointer;text-align:center}
#mp button.on{background:#ff6b35;border-color:#ff6b35;color:#fff;font-weight:700}
#mp button[hidden]{display:none}
#mp .pick{background:#4a7cff;border-color:#4a7cff;font-weight:700}
#mn{font-size:12px;opacity:.85;word-break:break-all}
#mp label.vol{display:flex;align-items:center;gap:8px;font-size:12px}
#mp input[type=range]{flex:1}
.brow{display:flex;gap:8px}
#ab,#gb,#sb{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,24,40,.55);font-size:20px;cursor:pointer;backdrop-filter:blur(4px)}
#sp{width:262px;min-height:0;flex:0 1 auto;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;box-sizing:border-box;background:rgba(18,22,40,.95);color:#eef0ff;border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#sp[hidden]{display:none}
#sp .sh{display:flex;justify-content:space-between;margin-bottom:8px;font-size:15px}
#sl{display:flex;flex-direction:column;gap:8px}
.sc{display:grid;grid-template-columns:48px 1fr;grid-template-areas:"a b" "c c";gap:6px 8px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px}
.sc.sel{border-color:#ffd23f;background:rgba(255,210,63,.14)}
.sc canvas{width:48px;height:48px;grid-area:a}
.sc .st{grid-area:b;display:flex;flex-direction:column;gap:2px}
.sc .st small{font-size:11px;opacity:.85;line-height:1.3}
.sc button{grid-area:c;border:0;border-radius:9px;padding:7px;font:inherit;font-weight:700;background:#4a7cff;color:#fff;cursor:pointer}
.sc button:disabled{opacity:.4;cursor:not-allowed}
#gb,#sb{}
#gp,#ap{width:262px;min-height:0;flex:0 1 auto;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;box-sizing:border-box;background:rgba(18,22,40,.97);color:#eef0ff;border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px}
#gp[hidden],#ap[hidden]{display:none}
#gp .row,#ap .row{display:flex;gap:6px}
#gp .row button,#ap .row button{flex:1;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:inherit;border-radius:10px;padding:8px 6px;font:inherit;cursor:pointer}
#gp .row button.on{background:#ff6b35;border-color:#ff6b35;color:#fff;font-weight:700}
#gp .note,#ap .note{font-size:12px;opacity:.85;line-height:1.35}
#gp .ms{display:grid;gap:3px;font-size:13px}
#gp .ms small{opacity:.8}
#gp .ms i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
#gp .ms u{display:block;height:100%;background:#4cd964}
#gate{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,12,30,.95);border-radius:14px;color:#eef0ff;padding:20px;box-sizing:border-box}
#gate .gc{width:100%;max-width:290px;display:flex;flex-direction:column;gap:10px;text-align:center}
#gate h2{margin:0;font-size:1.7rem}
#gate p{margin:0;opacity:.9;line-height:1.4;font-size:14px}
#gate .row{display:flex;gap:8px}
#gate .row button{flex:1;border:0;border-radius:10px;padding:11px;font:700 15px system-ui,sans-serif;background:#4a7cff;color:#fff;cursor:pointer}
#gate .row button+button{background:#ff6b35}
#gate .note{font-size:13px;min-height:18px;color:#ffd23f}
#adb{position:absolute;left:50%;top:86%;transform:translateX(-50%);z-index:5;display:none;border:0;border-radius:999px;padding:11px 18px;font:700 15px system-ui,sans-serif;background:#2fbf71;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap;cursor:pointer}
#adov{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);color:#fff;border-radius:14px;text-align:center;font-size:18px}
#adov p{margin:8px 0 0;opacity:.9}
#ap input,#gate input{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:inherit;border-radius:10px;padding:9px;font:inherit;width:100%;box-sizing:border-box}
#shr{position:absolute;left:50%;top:77%;transform:translateX(-50%);z-index:5;display:none;border:0;border-radius:999px;padding:12px 22px;font:700 16px system-ui,sans-serif;background:#4a7cff;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;white-space:nowrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9859321914434811"
     crossorigin="anonymous"></script>
</head>
<body>
<div id="wrap"><canvas id="c" width="540" height="900"></canvas>
<div id="ui"><button id="mb" aria-label="Music">🎵</button>
<div id="mp" hidden><b>🎵 Music</b>
<div class="row"><button data-m="default">Default tune</button><button data-m="custom" hidden>My song</button><button data-m="off">Off</button></div>
<label class="pick">📁 Choose your song<input id="mf" type="file" accept="audio/*" hidden></label>
<div id="mn"></div>
<label class="vol">🔊 <input id="mv" type="range" min="0" max="100" value="50"></label>
</div></div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false}),W=360,H=600,GY=520;
g.scale(1.5,1.5);
let best=0;try{best=+localStorage.getItem('fb_best')||0}catch(e){}
let st='ready',bird,pipes,score,f=0,gx=0,flash=0,pt=[],newBest=false,shake=0,deadT=0,sk=0,T=0;
// ---------- SKINS & COINS ----------
let wallet=0,owned=[0],skI=0,cns=[],runCoins=0,passCount=0,blaze=0,inv=0,shieldLeft=0,lastBonus=0,dailyMsg=0;
const DEF={shield:0,slow:1,grav:1,fl:1,sc:1,mag:0,blaze:0,cm:1};
const SKINS=[
{n:'Classic',cost:0,p:'🛡️ Shield: 1 free hit per run',c:['#fff176','#ffd23f','#f5a623'],bel:'#fff3c4',wing:'#ffb300',tail:'#e8920c',st:'#7a4a00',acc:0,shield:1},
{n:'Ninja',cost:80,p:'🐌 Slow-Mo: pipes move 18% slower',c:['#8fa0c0','#3b4a6b','#232d47'],bel:'#a9b6d0',wing:'#1b2236',tail:'#1b2236',st:'#0b0f1c',acc:1,slow:.82},
{n:'Fire',cost:150,p:'🔥 Blaze: every 7 pipes, a 3s unstoppable dash',c:['#ffb199','#ff5a3c','#c9261a'],bel:'#ffd5a8',wing:'#ff9a1f',tail:'#ffcc33',st:'#6a1208',acc:2,blaze:7},
{n:'Golden',cost:250,p:'🧲 Magnet: nearby coins are pulled to you',c:['#fff7b0','#ffd700','#d49a00'],bel:'#fffbe0',wing:'#e6a800',tail:'#c98a00',st:'#7a5500',acc:3,mag:1},
{n:'Angel',cost:400,p:'🪽 Float: lower gravity, easier flying',c:['#ffffff','#e8f0ff','#b9c8f0'],bel:'#ffffff',wing:'#cfe0ff',tail:'#cfe0ff',st:'#5a6ea0',acc:4,grav:.7,fl:.85},
{n:'Rainbow',cost:700,p:'⭐ Double: 2 points per pipe + 2x coins',c:['#ff9ad5','#a66bff','#4ac8ff'],bel:'#ffffff',wing:'#ffd23f',tail:'#ff6b6b',st:'#3c2a6b',acc:5,sc:2,cm:2}
].map(s=>({...DEF,...s}));
try{wallet=+localStorage.getItem('fb_coins')||0;owned=JSON.parse(localStorage.getItem('fb_own')||'[0]');skI=+localStorage.getItem('fb_skin')||0;if(!owned.includes(skI))skI=0}catch(_){}
let CUR=SKINS[skI];const SK=()=>CUR;
let gm='free',seed=0,rs=0,chalSeed=0,chalScore=0,toast=0,toastMsg='';
let SB=null,user=null,syncT=null,reviveUsed=false;
function RND(){rs=rs+0x6D2B79F5|0;let t=Math.imul(rs^rs>>>15,1|rs);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function dateKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function pickSeed(){return gm==='daily'?dateKey():gm==='chal'?chalSeed:(Math.random()*4294967296)>>>0}
function hideShr(){try{shr.style.display='none';adb.style.display='none'}catch(_){}}
try{const q=new URLSearchParams(location.search).get('c');if(q){const a=q.split('.');if(a.length==2&&!isNaN(a[0])&&!isNaN(a[1])){gm='chal';chalSeed=(+a[0])>>>0;chalScore=Math.max(0,Math.min(9999,+a[1]))}}}catch(_){}
function saveW(){try{localStorage.setItem('fb_coins',wallet);localStorage.setItem('fb_own',JSON.stringify(owned));localStorage.setItem('fb_skin',skI);localStorage.setItem('fb_ts',Date.now())}catch(_){}cloudSave()}
/* progress now lives in the player account */
// palettes: skyTop, skyBottom, farHill, nearHill, dark overlay
const PAL=[[[78,192,255],[189,238,255],[140,205,160],[110,190,110],0],[[255,110,90],[255,196,130],[200,120,130],[150,110,100],.08],[[10,14,50],[58,47,107],[40,50,100],[30,60,80],.38]];
const lerp=(a,b,t)=>a+(b-a)*t,mix=(a,b,t)=>a.map?a.map((v,i)=>lerp(v,b[i],t)):lerp(a,b,t);
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
function pal(){const i=Math.floor(sk)%3,fr=Math.max(0,(sk%1-.6)/.4),s=fr*fr*(3-2*fr),A=PAL[i],B=PAL[(i+1)%3];return A.map((v,k)=>mix(v,B[k],s))}
const clouds=[...Array(6)].map((_,i)=>({x:i*80,y:30+Math.random()*200,s:.15+Math.random()*.35,r:12+Math.random()*14,a:.5+Math.random()*.4}));
const stars=[...Array(40)].map(()=>({x:Math.random()*W,y:Math.random()*330,r:Math.random()*1.3+.3,p:Math.random()*6}));
let AC=null;
function snd(fr,d,type='square',v=.06){try{if(!AC)return;const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=fr;gn.gain.value=v;gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function reset(){bird={x:100,y:280,v:0,r:13,rot:0,wing:0,ph:0};pipes=[];score=0;f=0;newBest=false;pt=[];cns=[];runCoins=0;passCount=0;blaze=0;inv=0;lastBonus=0;shieldLeft=SK().shield;seed=pickSeed();rs=seed;reviveUsed=false;hideShr()}
function puff(x,y,n,cols,sp=3,l=30,s=3){for(let i=0;i<n;i++)pt.push({x,y,vx:(Math.random()-.5)*sp*2,vy:(Math.random()-.5)*sp*2-1,l:l+Math.random()*l/2,m:l*1.5,c:cols[i%cols.length],s:s*(.5+Math.random())})}
function flap(){
if(st==='ready'){st='play';f=0;ui(0)}
if(st==='play'){bird.v=-7.4*SK().fl;bird.wing=10;snd(520,.12);puff(bird.x-14,bird.y+6,4,['#fff','#ffe9a8'],1.2,18,3)}
else if(st==='dead'&&deadT>35){reset();st='ready'}}
function addPipe(){const gap=Math.max(120,155-score*1.2),top=70+RND()*(GY-gap-140);pipes.push({x:W+10,top,gap,passed:false});cns.push({x:W+36,y:top+gap/2+(RND()-.5)*gap*.45,r:9,t:Math.random()*60})}
function die(){if(st!=='play')return;const air=bird.y+bird.r<GY;if(air&&(blaze>0||inv>0))return;if(shieldLeft>0){shieldLeft--;inv=100;bird.v=-6.5;flash=6;snd(300,.25,'triangle',.1);puff(bird.x,bird.y,16,['#7ad0ff','#fff'],4,28,3);return}st='dead';inv=0;blaze=0;bird.bn=0;bird.rest=0;bird.v=-4.5;ui(1);const bonus=Math.floor(score/5);wallet+=bonus;lastBonus=bonus;saveW();msAdd('games',1);msAdd('score',score,1);dailyRec();setTimeout(()=>{if(st==='dead'){try{shr.style.display='block';if(!reviveUsed){adb.textContent='\ud83c\udfac Watch ad: get 1 extra life';adb.style.display='block'}}catch(_){}}},900);deadT=0;flash=10;shake=12;snd(130,.4,'sawtooth',.1);
puff(bird.x,bird.y,26,['#ffd23f','#ff8c42','#fff','#ff6b6b'],4.5,40,4);
if(score>best){best=score;newBest=true;try{localStorage.setItem('fb_best',best)}catch(e){}cloudSave()}}
function upd(){
T++;sk+=(score/15-sk)*.02;
const spd=(2.4+Math.min(score*.04,1.6))*SK().slow;
if(st!=='dead')gx+=spd;
clouds.forEach(k=>{k.x-=k.s;if(k.x<-60)k.x=W+60});
if(st==='ready'){bird.y=280+Math.sin(T/16)*8;bird.rot=Math.sin(T/16)*.1;bird.ph+=.3;return}
if(st==='play'){f++;
if(f===1||f%Math.max(70,100-score)===0)addPipe();
bird.v+=.45*SK().grav;bird.y+=bird.v;bird.rot=Math.max(-.45,Math.min(1.3,bird.v*.07));if(bird.wing>0)bird.wing--;bird.ph+=bird.wing>0?.7:.15;
pipes.forEach(p=>{p.x-=spd;
if(!p.passed&&p.x+26<bird.x){p.passed=true;onPass();snd(880,.1,'triangle',.08);puff(bird.x,bird.y,8,['#ffe066','#fff'],2.5,22,3)}
if(bird.x+bird.r-3>p.x&&bird.x-bird.r+3<p.x+52&&(bird.y-bird.r+3<p.top||bird.y+bird.r-3>p.top+p.gap))die()});
pipes=pipes.filter(p=>p.x>-70);updCoins(spd);
if(bird.y+bird.r>GY){bird.y=GY-bird.r;die()}
if(bird.y<-30){bird.y=-30;bird.v=0}}
else{deadT++;const hh=()=>24*Math.abs(Math.sin(bird.rot))+14*Math.abs(Math.cos(bird.rot));
if(!bird.rest){bird.v+=.6;bird.y+=bird.v;bird.rot+=(3.0-bird.rot)*.1;const h=hh();
if(bird.y+h>=GY){bird.y=GY-h;if(!bird.bn&&bird.v>3){bird.bn=1;bird.v=-bird.v*.35;snd(160,.15,'square',.07);puff(bird.x,GY-2,8,['#e8dca0','#fff'],2,18,2.5)}else{bird.rest=1;bird.v=0;snd(110,.12,'square',.06);puff(bird.x,GY-2,6,['#e8dca0','#fff'],1.5,16,2)}}}
else{bird.rot+=(3.0-bird.rot)*.15;bird.y=GY-hh()}}
pt.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.08;q.l--});pt=pt.filter(q=>q.l>0);
if(flash>0)flash--;if(shake>0)shake--}
function hills(off,base,amp,col,k){g.fillStyle=col;g.beginPath();g.moveTo(0,GY);for(let x=0;x<=W;x+=10){const X=x+off;g.lineTo(x,base-Math.sin(X*.011*k)*amp-Math.sin(X*.029*k+2)*amp*.4)}g.lineTo(W,GY);g.fill()}
function pipe(p,dk){
const x=p.x,w=52,by=p.top+p.gap;
const gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'#3d8f26');gr.addColorStop(.18,'#8fe05a');gr.addColorStop(.35,'#6ccc3e');gr.addColorStop(.8,'#4aa52b');gr.addColorStop(1,'#2f7a1c');
g.fillStyle=gr;g.strokeStyle='#1f5412';g.lineWidth=2;
g.fillRect(x,-4,w,p.top-20);g.strokeRect(x,-4,w,p.top-20);
g.fillRect(x,by+20,w,GY-by-20);g.strokeRect(x,by+20,w,GY-by-20);
g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x,p.top-34,w,10);g.fillRect(x,by+20,w,10);
[[p.top-24],[by]].forEach(([y])=>{g.fillStyle=gr;g.fillRect(x-4,y,w+8,24);g.strokeRect(x-4,y,w+8,24);
g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x+1,y+3,4,18);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x+w-4,y+2,6,20)});
g.fillStyle='rgba(255,255,255,.22)';g.fillRect(x+8,-4,3,p.top-30);g.fillRect(x+8,by+30,3,GY-by-30)}
function drawBird(){
g.save();g.translate(bird.x,bird.y);g.rotate(bird.rot);
g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(2,16,15,4,0,0,7);g.fill();
// tail
g.fillStyle='#e8920c';g.strokeStyle='#7a4a00';g.lineWidth=2;
g.beginPath();g.moveTo(-14,-2);g.lineTo(-27,-8);g.lineTo(-24,0);g.lineTo(-28,6);g.lineTo(-14,5);g.closePath();g.fill();g.stroke();
// body
const bg=g.createRadialGradient(-4,-6,2,0,0,20);bg.addColorStop(0,'#fff176');bg.addColorStop(.6,'#ffd23f');bg.addColorStop(1,'#f5a623');
g.fillStyle=bg;g.beginPath();g.ellipse(0,0,18,14,0,0,7);g.fill();g.stroke();
g.fillStyle='#fff3c4';g.beginPath();g.ellipse(3,6,11,6,.1,0,7);g.fill();
// wing
const wa=Math.sin(bird.ph)*.9;g.save();g.translate(-5,2);g.rotate(wa-.2);
g.fillStyle='#ffb300';g.beginPath();g.ellipse(-4,0,11,6,0,0,7);g.fill();g.stroke();
g.strokeStyle='rgba(122,74,0,.5)';g.lineWidth=1;g.beginPath();g.moveTo(-10,0);g.lineTo(2,0);g.stroke();g.restore();
g.strokeStyle='#7a4a00';g.lineWidth=2;
// cheek + eye
g.fillStyle='rgba(255,105,105,.55)';g.beginPath();g.arc(6,5,3.5,0,7);g.fill();
g.fillStyle='#fff';g.beginPath();g.arc(8,-5,6.5,0,7);g.fill();g.stroke();
g.fillStyle='#111';g.beginPath();g.arc(10,-5,3,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(11,-6,1.1,0,7);g.fill();
// beak
g.fillStyle='#ff7a2f';g.beginPath();g.moveTo(13,0);g.quadraticCurveTo(26,-1,25,3);g.lineTo(13,3);g.closePath();g.fill();g.stroke();
g.fillStyle='#e0402a';g.beginPath();g.moveTo(13,3);g.lineTo(24,3.5);g.quadraticCurveTo(22,9,13,8);g.closePath();g.fill();g.stroke();
g.restore()}
function draw(){
const P=pal(),night=PAL[Math.floor(sk)%3][4]>.3?1:0;
g.save();
if(shake>0)g.translate((Math.random()-.5)*shake/2,(Math.random()-.5)*shake/2);
const sky=g.createLinearGradient(0,0,0,GY);sky.addColorStop(0,rgb(P[0]));sky.addColorStop(1,rgb(P[1]));
g.fillStyle=sky;g.fillRect(-10,-10,W+20,GY+10);
// stars
const ns=P[4]/.38;if(ns>.05)stars.forEach(s=>{g.globalAlpha=ns*(.5+.5*Math.sin(T/20+s.p));g.fillStyle='#fff';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()});g.globalAlpha=1;
// sun / moon
const sy=170+P[4]*100-(1-ns)*0;
const sg=g.createRadialGradient(270,sy,6,270,sy,70);sg.addColorStop(0,ns>.5?'rgba(220,230,255,.5)':'rgba(255,240,170,.8)');sg.addColorStop(1,'rgba(255,240,170,0)');
g.fillStyle=sg;g.fillRect(190,sy-80,160,160);
g.fillStyle=ns>.5?'#eef2ff':'#fff6b0';g.beginPath();g.arc(270,sy,20,0,7);g.fill();

ab.onclick=()=>{ap.hidden=!ap.hidden;E('sp').hidden=true;E('mp').hidden=true;gp.hidden=true;if(!ap.hidden)renderAcct()};
function setMsg(t){const m=E('am');if(m)m.textContent=t;const q=E('gm');if(q)q.textContent=t}
function renderAcct(){
if(!SB){ap.innerHTML='<b>\ud83d\udc64 Account</b><div class="note">Login is not available right now. Your progress is still saved on this device.</div>';return}
if(user){ap.innerHTML='<b>\ud83d\udc64 Account</b><div class="note">Signed in as <b id="au"></b></div><div class="note" id="am">\u2601\ufe0f Your progress is saved automatically.</div><div class="row"><button data-a="out">Log out</button></div>';E('au').textContent=user.email||''}
else ap.innerHTML='<b>\ud83d\udc64 Account</b><div class="note">Log in to keep your coins, skins and best score on any device. You stay logged in on this device.</div><input id="ae" type="email" placeholder="Email" autocomplete="email"><input id="apw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password"><div class="row"><button data-a="in">Log in</button><button data-a="up">Sign up</button></div><div class="note" id="am"></div>';
ap.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>authDo(b.dataset.a))}
async function authDo(k,ei='ae',pi='apw'){if(k==='out'){await SB.auth.signOut();return}
const em=E(ei).value.trim(),pw=E(pi).value;if(!em||pw.length<6){setMsg('Enter your email and a password (at least 6 characters).');return}
setMsg('Please wait...');
try{const r=k==='up'?await SB.auth.signUp({email:em,password:pw}):await SB.auth.signInWithPassword({email:em,password:pw});
if(r.error){setMsg(r.error.message);return}
if(k==='up'&&!r.data.session)setMsg('Account created! Check your email to confirm it, then log in.')}catch(e){setMsg('Something went wrong. Please try again.')}}
function cloudSave(){if(!SB||!user)return;clearTimeout(syncT);syncT=setTimeout(pushNow,1500)}
async function pushNow(){if(!SB||!user)return;try{const r=await SB.from('game_progress').upsert({user_id:user.id,data:{wallet,owned,skin:skI,best,bd:bdate,ts:+localStorage.getItem('fb_ts')||Date.now()},updated_at:new Date().toISOString()});if(!r.error)setMsg('\u2601\ufe0f Saved')}catch(_){}}
function applyCloud(c,m){const gw=wallet,go=owned.slice(),gbs=best;
wallet=(c.wallet||0)+(m?gw:0);owned=[...new Set([...(c.owned||[0]),...(m?go:[])])];best=Math.max(c.best||0,m?gbs:0);
skI=owned.includes(c.skin)?c.skin:0;CUR=SKINS[skI];
try{localStorage.setItem('fb_best',best)}catch(_){}
saveW();if(!E('sp').hidden)shop();toast=130;toastMsg='\u2601\ufe0f Progress loaded'}
async function pull(){if(!SB||!user)return;try{
const r=await SB.from('game_progress').select('data').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;
const today=new Date().toDateString();let c=r.data&&r.data.data,bonus=false;
if(!c)c={wallet:0,owned:[0],skin:0,best:0,bd:today};
else if(c.bd!==today){c.wallet=(c.wallet||0)+20;c.bd=today;bonus=true}
bdate=c.bd;
try{localStorage.setItem('fb_uid',user.id)}catch(_){}
applyCloud(c,false);
if(bonus){toast=200;toastMsg='\ud83c\udf81 Daily bonus +20 \ud83e\ude99'}
setMsg('\u2601\ufe0f Progress loaded')}catch(_){setMsg('Could not load your progress. Check your internet.')}}
// ---------- REWARDED AD (test version): extra life ----------
const adb=document.createElement('button');adb.id='adb';E('wrap').appendChild(adb);
const adov=document.createElement('div');adov.id='adov';E('wrap').appendChild(adov);
// To connect a real ad network, define window.showRewardedAd(cb) that shows the ad and calls cb(true) when the reward should be given, or cb(false) if no ad is available.
function showAd(done){
if(typeof window.showRewardedAd==='function'){window.showRewardedAd(ok=>done(!!ok));return}
let n=5;adov.style.display='flex';adov.innerHTML='<div class="gc"><b>Ad (test)</b><p>Your extra life is coming in <span id="adn">5</span>s...</p></div>';
const t=setInterval(()=>{n--;const el=E('adn');if(el)el.textContent=n;if(n<=0){clearInterval(t);adov.style.display='none';done(true)}},1000)}
function revive(){reviveUsed=true;wallet-=lastBonus;lastBonus=0;newBest=false;msd.p.games=Math.max(0,msd.p.games-1);msSave();saveW();
let t=null;for(const p of pipes){if(p.x+60>bird.x-30&&(!t||p.x<t.x))t=p}
bird.y=t?t.top+t.gap/2:H/2-40;bird.v=-4;bird.rot=0;bird.rest=0;bird.bn=0;bird.wing=8;
inv=150;blaze=0;shake=0;flash=0;st='play';ui(0);toast=120;toastMsg='\u2764\ufe0f Extra life! Keep going'}
adb.onclick=()=>{if(reviveUsed||st!=='dead')return;adb.style.display='none';
showAd(ok=>{if(ok&&st==='dead')revive();else{adb.style.display='block';toast=120;toastMsg='No ad available, try later'}})};
let bdate='',authReady=false;
const gate=document.createElement('div');gate.id='gate';E('wrap').appendChild(gate);
function gateRender(){
if(!SB){gate.innerHTML='<div class="gc"><h2>\ud83d\udc24 Skywing Rush</h2><p>Cannot connect to the login service. Check your internet and reload the page.</p></div>';return}
if(!authReady){gate.innerHTML='<div class="gc"><h2>\ud83d\udc24 Skywing Rush</h2><p>Loading...</p></div>';return}
gate.innerHTML='<div class="gc"><h2>\ud83d\udc24 Skywing Rush</h2><p>Log in or create a free account to play. Your coins and skins are saved to your account.</p><input id="ge" type="email" placeholder="Email" autocomplete="email"><input id="gpw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password"><div class="row"><button data-gt="in">Log in</button><button data-gt="up">Sign up</button></div><p id="gm" class="note"></p></div>';
gate.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>authDo(b.dataset.gt,'ge','gpw'))}
function gateUpd(){const need=!(SB&&user);gate.style.display=need?'flex':'none';const key=authReady+'|'+(SB?1:0);if(need){if(gate.dataset.s!==key){gate.dataset.s=key;gateRender()}}else gate.dataset.s=''}
gate.addEventListener('keydown',e=>{if(e.key==='Enter'&&E('ge'))authDo('in','ge','gpw')});
authReady=!SB;gateUpd();
setTimeout(()=>{if(!authReady){authReady=true;gateUpd()}},6000);
let lastPull=null;
if(SB)SB.auth.onAuthStateChange((ev,sess)=>{user=sess?sess.user:null;authReady=true;gateUpd();if(!user)lastPull=null;if(!ap.hidden)renderAcct();if(user&&user.id!==lastPull){lastPull=user.id;setTimeout(pull,0)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pushNow()});
requestAnimationFrame(loop);
</script>
</body>
</html>
